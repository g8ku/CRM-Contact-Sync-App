name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ContactSync.API/ContactSync.API.csproj

      - name: Build
        run: dotnet build ContactSync.API/ContactSync.API.csproj --no-restore

      - name: Restore test dependencies
        run: dotnet restore ContactSync.Tests/ContactSync.Tests.csproj

      - name: Run tests
        run: dotnet test ContactSync.Tests/ContactSync.Tests.csproj --no-restore --verbosity normal